org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The ExecuTorch Android runtime (org.pytorch:executorch-android).
# The .pte must be loadable by this runtime: it loads on the release that exported it and
# the next one. The deployment block builds the CPU model.pte with ExecuTorch 1.3.1.
# If the build can't find this version on Maven Central, pick the nearest one listed at
# https://mvnrepository.com/artifact/org.pytorch/executorch-android and re-check the .pte.
executorchVersion=1.3.1
